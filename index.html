
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CIP Barista Workshop</title>
<style>
:root{--gold:#f6c45b;--bg:#17110d;--panel:#2b2018}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#120d09;color:#fff;font-family:Tahoma,Arial,sans-serif;font-size:12px}
button{font:inherit;cursor:pointer}
.app{max-width:480px;margin:auto;min-height:100vh;padding:6px;background:radial-gradient(ellipse at top,#49301c,#1c140e 48%,#120d09)}
header{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px}
.hud{display:flex;align-items:center;gap:6px;padding:6px 8px;background:linear-gradient(145deg,#49301b,#211710);border:1px solid #8d652d;border-radius:10px;box-shadow:inset 0 1px #a67d48}
.hud small{display:block;color:#c6b18d;font-size:9px;margin-bottom:3px}
.hud strong{color:var(--gold);font-size:13px}
.hud .sym{font-size:18px}
.brand{grid-column:1/-1;text-align:center;font-size:17px;font-weight:bold;color:var(--gold);letter-spacing:4px;padding:1px}
.brand small{display:block;font-size:8px;letter-spacing:2px;color:#c6a879;margin-top:2px}
.panel{background:linear-gradient(150deg,#38271a,#201711);border:1px solid #795329;border-radius:11px;padding:7px;margin-bottom:6px;box-shadow:0 4px 10px #090604}
.title{font-weight:bold;color:var(--gold);margin-bottom:5px;font-size:12px}
.orders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.order{display:flex;align-items:center;gap:5px;background:linear-gradient(135deg,#30231a,#17120e);border:1px solid #624627;border-radius:9px;padding:5px;min-height:51px;min-width:0}
.order.selected{border-color:#ffdb7d;box-shadow:0 0 6px #b9843540}
.ring{width:34px;height:34px;flex-shrink:0;display:grid;place-items:center;position:relative;border-radius:50%;background:conic-gradient(#f4c25a var(--p),#4b3928 0)}
.ring:before{content:"";position:absolute;inset:3px;background:#211710;border-radius:50%;border:1px solid #70502d}
.ring span{position:relative;z-index:1;font-size:17px}
.oname{font-weight:bold;font-size:9px;line-height:1.6}
.otime{color:#e7bd69;font-size:9px;margin-top:2px}
.station{padding:0;overflow:hidden}
.station-head{display:flex;justify-content:space-between;align-items:center;padding:7px}
.station-head .title{margin:0}
.equipment-room{position:relative;background:radial-gradient(ellipse at 50% 25%,#63452c,#302015 58%,#1b130d);padding:8px 8px 0;overflow:hidden}
.wall-light{position:absolute;top:0;left:15%;right:15%;height:100px;background:radial-gradient(ellipse at top,#c59a5140,transparent 70%);pointer-events:none}
.equipment-row{position:relative;z-index:1;display:grid;grid-template-columns:.8fr 1.35fr;align-items:end;gap:5px;max-width:380px;margin:auto}
.equipment{min-width:0;display:flex;flex-direction:column;align-items:center}
.equip-hit{width:100%;border:0;background:none;padding:0;display:block;filter:drop-shadow(0 8px 5px #050302aa);touch-action:manipulation}
.equip-hit:active{transform:translateY(2px) scale(.99)}
.equip-hit svg{display:block;width:100%;height:auto;overflow:visible}
.equip-label{font-size:10px;color:#f4d8a2;font-weight:bold;text-align:center;margin:3px 0}
.hint{font-size:9px;color:#d1b58a;text-align:center;min-height:13px;margin-bottom:5px}
.machine-counter{position:relative;z-index:2;height:13px;margin:0 -8px;background:linear-gradient(#6f4725,#b47b3e 30%,#5b361a 75%,#26170e);border-top:1px solid #d6a05b;box-shadow:0 -2px 8px #09060480}
.upgrades{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:6px;background:#241910}
.upgrade{border:1px solid #72512b;border-radius:8px;background:linear-gradient(135deg,#46301c,#24170e);padding:6px 4px;text-align:center;color:#f4d9a0;font-size:9px;line-height:1.6}
.upgrade strong{display:block;color:var(--gold);font-size:10px}
.upgrade:disabled{opacity:.45}
.bench{background:linear-gradient(145deg,#88552a,#3f2616);border:2px solid #b78345;border-radius:10px;padding:6px;box-shadow:inset 0 2px 4px #e0ae6340}
.bench-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.bench-title{font-weight:bold;color:#ffe6b0;font-size:11px}
.bench-note{font-size:8px;color:#eed2a0}
.bench-surface{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:linear-gradient(#6b421f,#422816);border-radius:8px;border:1px solid #b8864b}
.slot{min-height:59px;border-radius:7px;background:linear-gradient(145deg,#39271a,#24170f);border:1px solid #8e6537;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px;text-align:center;overflow:hidden}
.slot svg{width:43px;height:32px;filter:drop-shadow(0 2px 2px #080604)}
.slot-name{font-size:8px;color:#f5dfb7;line-height:1.4}
.slot button{background:#755021;color:#fff0c7;border:1px solid #d4a34d;border-radius:5px;padding:4px 2px;width:100%;font-size:8px}
.empty{color:#9f8060;font-size:9px}
.status{font-size:9px;text-align:center;line-height:1.7;color:#d8c4a4;margin:5px 0 2px}
.bottom-actions{display:flex;gap:5px;margin-top:5px}
.bottom-actions button{flex:1;border:1px solid #956a31;border-radius:8px;padding:8px 4px;background:#342316;color:#f9d994;font-size:10px}
.bottom-actions .start{background:linear-gradient(#c68b34,#87521e);color:#fff6df;font-weight:bold}
button:disabled{opacity:.4}
.progress{height:4px;background:#4c3522;border-radius:5px;overflow:hidden;margin-top:5px}
.progress div{height:100%;width:0;background:linear-gradient(90deg,#b77825,#ffe18a)}
@media(max-width:350px){.app{padding:4px}.hud{padding:5px}.ring{width:30px;height:30px}.order{gap:3px;padding:4px}.oname{font-size:8px}.equipment-room{padding-left:4px;padding-right:4px}.equip-label{font-size:9px}}
</style>
</head>
<body>

<div class="brand">CIP<small>BARISTA WORKSHOP</small></div>

<div class="title">☕ سفارش مشتری‌ها</div>

</div>

<div class="upgrades">
<button class="upgrade" id="machineUpgrade" onclick="upgradeMachine()"><strong>⬆ ارتقای دستگاه</strong><span id="machinePrice">۱۵٬۰۰۰ سکه</span></button>
<button class="upgrade" id="grinderUpgrade" onclick="upgradeGrinder()"><strong>⚙ ارتقای آسیاب</strong><span id="grinderPrice">۸٬۰۰۰ سکه</span></button>

<section class="panel">
<div class="bench">
<div class="bench-top"><div class="bench-title">☕ میز کار</div><div class="bench-note">برای تحویل، فنجان را لمس کن</div></div>
<div id="slots" class="bench-surface"></div>
</div>

</div>

<script>
const $=id=>document.getElementById(id),fa=n=>Math.max(0,Math.ceil(n)).toLocaleString('fa-IR');
let coins=5500,groups=1,grinderLevel=1,done=0,timeLeft=120,running=false,busy=false,groundCoffee=false;
let orders=[],slots=[],selected=null,nextId=1,mainTimer=null,orderTimer=null,token=0;
const machineCosts={2:15000,3:35000,4:70000},grinderCosts={2:8000,3:16000};
const types=[{name:'اسپرسو سینگل',icon:'☕'},{name:'اسپرسو دبل',icon:'🍵'}];
function msg(t){$('message').textContent=t}
function renderHud(){
 $('coins').textContent=coins.toLocaleString('en-US');$('score').textContent=fa(done)+' / ۱۰۰';$('clock').textContent=fa(timeLeft)+' ثانیه';$('active').textContent=fa(orders.filter(o=>o.status==='waiting').length);$('groupLabel').textContent=fa(groups)+' گروپ';$('progress').style.width=done+'%';
 $('machinePrice').textContent=groups>=4?'حداکثر سطح':fa(machineCosts[groups+1])+' سکه';
 $('grinderPrice').textContent=grinderLevel>=3?'حداکثر سطح':fa(grinderCosts[grinderLevel+1]||8000)+' سکه';
 $('machineUpgrade').disabled=running||groups>=4||coins<machineCosts[groups+1];
 $('grinderUpgrade').disabled=running||grinderLevel>=3||coins<(grinderCosts[grinderLevel+1]||8000);
}
function renderOrders(){
 const host=$('orders');
 orders.forEach(o=>{
  let el=document.getElementById('order-'+o.id);
  if(!el){el=document.createElement('div');el.id='order-'+o.id;el.className='order';el.innerHTML='<div class="ring"><span></span></div><div><div class="oname"></div><div class="otime"></div></div>';el.onclick=()=>{if(!running||o.status!=='waiting')return;selected=o.id;renderOrders();msg('سفارش انتخاب شد: '+o.name)};host.appendChild(el)}
  el.className='order'+(selected===o.id?' selected':'');
  el.querySelector('.ring').style.setProperty('--p',Math.max(0,o.left/o.max*100)+'%');
  el.querySelector('.ring span').textContent=o.icon;el.querySelector('.oname').textContent=o.name;
  el.querySelector('.otime').textContent=o.status==='waiting'?fa(o.left)+' ثانیه':o.status==='served'?'تحویل شد':'منقضی';
  el.style.opacity=o.status==='waiting'?'1':'.5';
 });
 const ids=new Set(orders.map(o=>'order-'+o.id));[...host.children].forEach(el=>{if(!ids.has(el.id))el.remove()});
}
function cupSVG(){return '<svg viewBox="0 0 70 54"><defs><linearGradient id="cupw"><stop stop-color="#b7a58c"/><stop offset=".4" stop-color="#fff6e6"/><stop offset="1" stop-color="#b7a58c"/></linearGradient></defs><ellipse cx="35" cy="46" rx="28" ry="6" fill="#17100b"/><ellipse cx="35" cy="41" rx="26" ry="7" fill="#d4c3a9" stroke="#8c7759" stroke-width="2"/><path d="M18 17 H49 L45 36 Q34 44 22 36Z" fill="url(#cupw)" stroke="#a99a83" stroke-width="2"/><ellipse cx="33.5" cy="18" rx="15" ry="5" fill="#4b2514" stroke="#f0d8b0" stroke-width="2"/><path d="M49 21 Q64 18 57 32 L46 32" fill="none" stroke="#eee2cf" stroke-width="5"/></svg>'}
function renderSlots(){
 const host=$('slots');host.innerHTML='';
 for(let i=0;i<3;i++){const s=slots[i],el=document.createElement('div');el.className='slot';
 if(s){el.innerHTML=cupSVG()+'<div class="slot-name">'+s.name+'</div><button>تحویل</button>';el.querySelector('button').onclick=()=>deliver(s.id)}
 else el.innerHTML='<div class="empty" style="font-size:20px">☕</div><div class="empty">خالی</div>';
 host.appendChild(el)}
}
function makeOrder(){const t=types[Math.floor(Math.random()*types.length)];return{id:nextId++,name:t.name,icon:t.icon,max:35,left:35,status:'waiting'}}
function fillOrders(){while(orders.filter(o=>o.status==='waiting').length<groups+1)orders.push(makeOrder());renderOrders();renderHud()}
function startRun(){
 if(running)return;running=true;busy=false;groundCoffee=false;token++;done=0;timeLeft=120;slots=[];orders=[];
 for(let i=0;i<groups+1;i++)orders.push(makeOrder());selected=orders[0]?.id??null;$('startBtn').disabled=true;renderOrders();renderSlots();renderHud();msg('روی آسیاب بزن تا قهوه آسیاب شود.');
 mainTimer=setInterval(()=>{if(!running)return;timeLeft--;if(timeLeft<=0){timeLeft=0;endRun('زمان بازی تمام شد! برای دور تازه شروع مجدد را بزن.');return}renderHud()},1000);
 orderTimer=setInterval(()=>{if(!running)return;let expired=false;orders.forEach(o=>{if(o.status==='waiting'){o.left--;if(o.left<=0){o.left=0;o.status='expired';expired=true}}});renderOrders();renderHud();if(expired)endRun('زمان یک سفارش تمام شد؛ این دور پایان یافت.')},1000);
}
function tapGrinder(){
 if(!running)return msg('ابتدا بازی را شروع کن.');if(busy)return;
 if(!selected)return msg('یک سفارش فعال انتخاب کن.');
 const o=orders.find(x=>x.id===selected&&x.status==='waiting');if(!o)return msg('یک سفارش فعال انتخاب کن.');
 if(slots.length>=3)return msg('میز کار پر است؛ ابتدا یک فنجان را تحویل بده.');
 busy=true;groundCoffee=false;const my=++token;$('grindHint').textContent='در حال آسیاب…';msg('آسیاب در حال آماده‌کردن قهوه است…');
 setTimeout(()=>{if(!running||my!==token)return;busy=false;groundCoffee=true;$('grindHint').textContent='قهوه آماده شد ✓';msg('حالا روی دستگاه اسپرسو بزن تا عصاره‌گیری شود.')},({1:3000,2:2200,3:1500}[grinderLevel]||3000));
}
function tapMachine(){
 if(!running)return msg('ابتدا بازی را شروع کن.');if(busy)return;
 if(!groundCoffee)return msg('اول روی آسیاب بزن.');
 const o=orders.find(x=>x.id===selected&&x.status==='waiting');if(!o)return msg('یک سفارش فعال انتخاب کن.');
 if(slots.length>=3)return msg('میز کار پر است؛ نوشیدنی را تحویل بده.');
 busy=true;groundCoffee=false;const my=++token;$('machineHint').textContent='در حال عصاره‌گیری…';msg('دستگاه در حال عصاره‌گیری اسپرسو است…');
 setTimeout(()=>{if(!running||my!==token)return;busy=false;$('machineHint').textContent='آماده ✓';slots.push({id:nextId++,orderId:o.id,name:o.name});renderSlots();msg('شات آماده است؛ روی فنجان میز کار بزن تا تحویل شود.')},groups>=2?2500:4000);
}
function deliver(id){
 if(!running)return msg('ابتدا بازی را شروع کن.');const index=slots.findIndex(s=>s.id===id);if(index<0)return;
 const s=slots[index],o=orders.find(x=>x.id===s.orderId);if(!o||o.status!=='waiting')return msg('این سفارش دیگر فعال نیست.');
 o.status='served';slots.splice(index,1);done++;orders=orders.filter(x=>x.id!==o.id);
 if(done>=100){renderSlots();renderOrders();renderHud();endRun('تبریک! ۱۰۰ سفارش را تکمیل کردی!');return}
 fillOrders();selected=orders.find(x=>x.status==='waiting')?.id??null;groundCoffee=false;$('grindHint').textContent='لمس برای آسیاب';$('machineHint').textContent='لمس برای عصاره‌گیری';renderOrders();renderSlots();renderHud();msg('سفارش تحویل شد! سفارش بعدی را انتخاب کن.')
}
function upgradeMachine(){if(running||groups>=4)return;const price=machineCosts[groups+1];if(coins<price)return;coins-=price;groups++;renderHud();msg('دستگاه ارتقا یافت.')}
function upgradeGrinder(){if(running||grinderLevel>=3)return;const price=grinderCosts[grinderLevel+1];if(coins<price)return;coins-=price;grinderLevel++;renderHud();msg('آسیاب ارتقا یافت؛ سرعت آسیاب بیشتر شد.')}
function endRun(text){running=false;busy=false;token++;clearInterval(mainTimer);clearInterval(orderTimer);$('startBtn').disabled=false;$('grindHint').textContent='لمس برای آسیاب';$('machineHint').textContent='لمس برای عصاره‌گیری';renderHud();renderOrders();renderSlots();msg(text)}
function resetRun(){endRun('برای شروع دور تازه، شروع بازی را بزن.');orders=[];slots=[];selected=null;timeLeft=120;done=0;groundCoffee=false;renderOrders();renderSlots();renderHud()}
renderHud();renderOrders();renderSlots();
</script>
