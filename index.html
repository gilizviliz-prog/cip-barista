
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CIP Barista</title>
<style>
:root{--gold:#e9b84d;--dark:#17120f;--panel:#28201a;--cream:#f4e4c2;--green:#287b45}
*{box-sizing:border-box}
body{margin:0;background:#17110e;color:#fff;font-family:Tahoma,Arial,sans-serif;font-size:12px}
button{font:inherit;cursor:pointer;color:inherit;border:1px solid #785728;background:#38291b;border-radius:10px;padding:9px}
button:disabled{opacity:.35;cursor:default}
.app{width:100%;max-width:480px;min-height:100vh;margin:auto;padding:9px;background:linear-gradient(#302017,#17110e 48%)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#241a14;border:1px solid #76552a;border-radius:14px;padding:10px;margin-bottom:8px}
.logo{font-size:19px;color:var(--gold);font-weight:bold;letter-spacing:2px}
.coins{color:var(--gold);font-weight:bold;font-size:15px}
.stats{display:flex;gap:6px;margin-bottom:8px}
.stat{flex:1;background:#292019;border:1px solid #5c4224;border-radius:10px;padding:8px 4px;text-align:center}
.stat strong{display:block;color:var(--gold);font-size:14px;margin-top:5px}
.section{background:#261d17;border:1px solid #674a29;border-radius:13px;padding:9px;margin-bottom:9px}
.section-title{color:var(--gold);font-size:13px;font-weight:bold;margin-bottom:9px}
.orders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.order{display:flex;align-items:center;gap:8px;min-height:78px;background:#181411;border:1px solid #57412b;border-radius:12px;padding:7px}
.ring{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:conic-gradient(var(--gold) var(--p,100%),#493a2a 0);position:relative}
.ring:before{content:"";position:absolute;inset:4px;background:#201914;border-radius:50%}
.ring span{z-index:1;font-size:23px}
.order-name{font-size:11px;font-weight:bold;line-height:1.7}
.time{font-size:10px;color:#d9b96e;margin-top:4px}
.counter{font-size:10px;color:#b9a78e}
.art{width:100%;display:block;object-fit:contain}
.machine-scene{background:linear-gradient(145deg,#3c2b1d,#211812);border:1px solid #8a6231;border-radius:13px;padding:8px;overflow:hidden}
.equipment{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px}
.equip{background:#211812;border:1px solid #57402a;border-radius:10px;padding:6px;text-align:center;min-width:0}
.equip svg{width:100%;height:90px;display:block}
.equip-name{font-weight:bold;margin:5px 0;color:var(--cream)}
.level{font-size:10px;color:#cbb38a;margin-bottom:6px}
.equip button{width:100%;font-size:10px;padding:7px 2px}
.upgrade{border-color:var(--gold);color:#ffe0a0}
.workbench{background:linear-gradient(#49301d,#241810);border:2px solid #94612e;border-radius:12px;padding:10px;margin-top:8px}
.bench-title{color:#ffe0a0;font-weight:bold;margin-bottom:9px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slot{min-height:92px;border:1px dashed #997346;border-radius:10px;background:#211711;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:5px;text-align:center}
.slot svg{width:53px;height:47px}
.slot button{font-size:10px;padding:6px;width:100%}
.muted{color:#b8a28a;font-size:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.actions button{padding:12px 5px;font-weight:bold}
.primary{background:#9b641f;border-color:#f1c15a}
.green{background:#215d38;border-color:#4aa568}
.danger{background:#4b211c;border-color:#9c5140}
.note{font-size:10px;color:#c8b99f;text-align:center;line-height:1.8;margin:8px 0}
.progress{height:6px;background:#453326;border-radius:8px;overflow:hidden;margin-top:7px}
.progress div{height:100%;width:0;background:var(--gold)}
@media(max-width:360px){.app{padding:6px}.ring{width:40px;height:40px}.order{gap:5px;padding:5px}.equip svg{height:76px}.slot{min-height:82px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><div class="logo">CIP</div><div class="muted">BARISTA WORKSHOP</div></div>
  <div class="coins">🪙 <span id="coins">5,500</span></div>
  <button onclick="resetRun()">↻</button>
</header>

<div class="stats">
  <div class="stat">سفارش موفق<strong id="done">۰ / ۱۰۰</strong></div>
  <div class="stat">زمان بازی<strong id="clock">۱۲۰ ثانیه</strong></div>
  <div class="stat">سفارش فعال<strong id="active">۲</strong></div>
</div>

<section class="section">
  <div class="section-title">☕ سفارش‌های مشتری‌ها</div>
  <div id="orders" class="orders"></div>
</section>

<section class="section">
  <div class="section-title">🏪 ایستگاه باریستا</div>
  <div class="machine-scene">
    <svg class="art" viewBox="0 0 340 190" role="img" aria-label="تصویر نقاشی دستگاه اسپرسو و آسیاب قهوه">
      <defs>
        <linearGradient id="steel" x1="0" x2="1"><stop stop-color="#504c48"/><stop offset=".35" stop-color="#ddd5c7"/><stop offset=".65" stop-color="#77716b"/><stop offset="1" stop-color="#332d29"/></linearGradient>
        <linearGradient id="wood" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#b9823d"/><stop offset="1" stop-color="#58331a"/></linearGradient>
      </defs>
      <rect x="6" y="150" width="328" height="26" rx="4" fill="url(#wood)" stroke="#e1ad60" stroke-width="2"/>
      <rect x="15" y="176" width="310" height="10" fill="#21140e"/>
      <!-- آسیاب -->
      <path d="M28 30 Q28 23 36 23 H74 Q82 23 82 30 L76 60 H34Z" fill="#171615" stroke="#aaa39a" stroke-width="2"/>
      <path d="M34 31 H76 L72 57 H38Z" fill="#633d20"/>
      <g fill="#4c2815"><circle cx="42" cy="37" r="4"/><circle cx="56" cy="43" r="5"/><circle cx="68" cy="35" r="4"/><circle cx="49" cy="52" r="4"/><circle cx="66" cy="51" r="4"/></g>
      <rect x="34" y="61" width="43" height="55" rx="5" fill="#202020" stroke="url(#steel)" stroke-width="3"/>
      <rect x="41" y="69" width="29" height="14" rx="2" fill="#504b43"/>
      <circle cx="55" cy="76" r="4" fill="#e7b94f"/>
      <rect x="42" y="91" width="26" height="5" fill="#77716a"/>
      <path d="M55 116 V130 H86" stroke="#b8b0a3" stroke-width="5" fill="none"/>
      <path d="M79 130 H94 L91 136 H80Z" fill="#c8c1b5"/>
      <!-- دستگاه اسپرسو -->
      <rect x="105" y="46" width="215" height="101" rx="8" fill="url(#steel)" stroke="#171412" stroke-width="3"/>
      <rect x="114" y="54" width="197" height="29" rx="3" fill="#292623"/>
      <rect x="121" y="59" width="35" height="17" rx="2" fill="#4b5149"/>
      <circle cx="139" cy="67" r="5" fill="#d4b466"/>
      <circle cx="184" cy="68" r="11" fill="#dfd4bd" stroke="#333" stroke-width="3"/>
      <path d="M184 68 L189 62" stroke="#a63b24" stroke-width="2"/>
      <circle cx="222" cy="68" r="5" fill="#6d9e79"/>
      <circle cx="243" cy="68" r="5" fill="#d9b64f"/>
      <rect x="119" y="88" width="184" height="42" rx="3" fill="#242220"/>
      <path d="M132 90 V111 M144 90 V111 M156 90 V111 M168 90 V111 M180 90 V111 M192 90 V111 M204 90 V111 M216 90 V111 M228 90 V111 M240 90 V111 M252 90 V111 M264 90 V111 M276 90 V111 M288 90 V111" stroke="#68615a" stroke-width="1"/>
      <path d="M153 78 V94 H170 L176 103" stroke="#bdb5a8" stroke-width="7" fill="none"/>
      <path d="M176 103 L190 111" stroke="#282523" stroke-width="8"/>
      <path d="M183 111 L183 122" stroke="#c8bfb0" stroke-width="5"/>
      <path d="M173 123 Q183 129 193 123 L191 135 H175Z" fill="#d4bba0"/>
      <rect x="114" y="137" width="197" height="8" rx="2" fill="#b9b0a3"/>
      <text x="213" y="145" font-size="9" text-anchor="middle" fill="#29211a" font-weight="bold">CIP ESPRESSO</text>
      <!-- فنجان روی میز -->
      <ellipse cx="217" cy="155" rx="16" ry="4" fill="#251912"/>
      <path d="M205 137 H228 L225 151 Q217 158 209 151Z" fill="#eee3d1" stroke="#9f927d"/>
      <ellipse cx="216" cy="138" rx="11" ry="3" fill="#4a2515"/>
      <path d="M228 141 Q239 139 232 148 L226 148" stroke="#e6d9c4" stroke-width="4" fill="none"/>
    </svg>
    <div class="equipment">
      <div class="equip">
        <svg viewBox="0 0 120 100" role="img" aria-label="آسیاب قهوه">
          <path d="M30 8 H90 L82 38 H38Z" fill="#171615" stroke="#c5b9a4" stroke-width="2"/>
          <path d="M38 15 H82 L77 35 H43Z" fill="#75451f"/>
          <g fill="#3c2113"><circle cx="50" cy="23" r="4"/><circle cx="65" cy="19" r="4"/><circle cx="72" cy="29" r="4"/><circle cx="54" cy="31" r="4"/></g>
          <rect x="38" y="39" width="44" height="43" rx="5" fill="#252525" stroke="#aaa194" stroke-width="3"/>
          <rect x="47" y="47" width="26" height="11" fill="#514c45"/>
          <circle cx="60" cy="52" r="3" fill="#e9b84d"/>
          <path d="M59 82 V90 H87" stroke="#b6aa99" stroke-width="4"/>
          <path d="M79 89 H94 L91 95 H80Z" fill="#ddd1bd"/>
        </svg>
        <div class="equip-name">آسیاب قهوه</div>
        <div class="level" id="grinderLevel">سطح ۱</div>
        <button id="grindBtn" class="green" onclick="grind()">آسیاب کردن</button>
      </div>
      <div class="equip">
        <svg viewBox="0 0 120 100" role="img" aria-label="دستگاه اسپرسوساز">
          <rect x="10" y="21" width="100" height="63" rx="7" fill="#a9a49b" stroke="#37302a" stroke-width="4"/>
          <rect x="18" y="29" width="84" height="19" rx="3" fill="#252321"/>
          <circle cx="40" cy="38" r="7" fill="#ddd0b9"/><path d="M40 38 L44 33" stroke="#a13d2d" stroke-width="2"/>
          <circle cx="63" cy="38" r="4" fill="#d9ad4e"/>
          <rect x="18" y="53" width="84" height="22" fill="#393530"/>
          <path d="M45 48 V64 H60 L66 72" stroke="#bdb5a8" stroke-width="5" fill="none"/>
          <path d="M65 72 V81" stroke="#d0c4b0" stroke-width="4"/>
          <rect x="15" y="83" width="90" height="5" fill="#c7b9a4"/>
        </svg>
        <div class="equip-name">اسپرسوساز</div>
        <div class="level" id="machineLevel">۱ گروپ</div>
        <button id="machineBtn" class="upgrade" onclick="upgradeMachine()">ارتقا · ۱۵٬۰۰۰</button>
      </div>
    </div>
  </div>

  <div class="workbench">
    <div class="bench-title">🍮 میز کار و تحویل سفارش</div>
    <div class="slots" id="slots"></div>
  </div>

  <div class="actions">
    <button class="primary" id="startBtn" onclick="startRun()">▶ شروع بازی</button>
    <button onclick="resetRun()">↻ شروع مجدد</button>
  </div>
  <div class="progress"><div id="progress"></div></div>
  <div class="note" id="message">ابتدا سفارش را انتخاب کن، قهوه را آسیاب و سپس عصاره‌گیری کن.</div>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
let coins=5500,groups=1,grinderLevel=1,done=0,totalTime=120,timeLeft=120;
let running=false,orders=[],slots=[],selected=null,busy=false;
let mainTimer=null,orderTimer=null,nextId=1;
const machinePrices={2:15000,3:35000,4:70000};
const grinderPrices={2:8000,3:16000};
const fa=n=>Math.max(0,Math.ceil(n)).toLocaleString('fa-IR');
const orderTypes=[
 {name:'اسپرسو سینگل',icon:'☕',shot:1},
 {name:'اسپرسو دبل',icon:'🍵',shot:2}
];
function setMsg(t){$('message').textContent=t}
function renderStats(){
 $('coins').textContent=coins.toLocaleString('en-US');
 $('done').textContent=fa(done)+' / ۱۰۰';
 $('clock').textContent=fa(timeLeft)+' ثانیه';
 $('active').textContent=fa(orders.filter(o=>o.status==='waiting').length);
 $('progress').style.width=(done)+'%';
 $('grinderLevel').textContent=grinderLevel?'سطح '+fa(grinderLevel):'خریدنی';
 $('machineLevel').textContent=fa(groups)+' گروپ';
 $('machineBtn').textContent=groups<4?'ارتقا · '+fa(machinePrices[groups+1]):'حداکثر ارتقا';
 $('machineBtn').disabled=groups>=4||coins<machinePrices[groups+1]||running;
}
function renderOrders(){
 $('orders').innerHTML='';
 orders.forEach(o=>{
  const el=document.createElement('div');el.className='order';
  const pct=Math.max(0,o.left/o.max*100);
  el.innerHTML=`<div class="ring" style="--p:${pct}%"><span>${o.icon}</span></div><div><div class="order-name">${o.name}</div><div class="time">${o.status==='waiting'?fa(o.left)+' ثانیه':'در انتظار'}</div><div class="counter">${o.status==='waiting'?'● فعال':'○ آماده'}</div></div>`;
  el.onclick=()=>{if(o.status==='waiting'){selected=o.id;setMsg('سفارش انتخاب شد: '+o.name);renderSlots()}};
  if(selected===o.id)el.style.borderColor='#e9b84d';
  $('orders').appendChild(el);
 });
}
function renderSlots(){
 $('slots').innerHTML='';
 const data=slots.slice(0,3);
 while(data.length<3)data.push(null);
 data.forEach((s,i)=>{
  const el=document.createElement('div');el.className='slot';
  if(s){
   el.innerHTML=`<svg viewBox="0 0 60 50"><ellipse cx="29" cy="39" rx="25" ry="7" fill="#bba58a"/><ellipse cx="29" cy="35" rx="22" ry="6" fill="#f2e7d4"/><path d="M14 16 H44 L40 33 Q29 42 18 33Z" fill="#eee4d3" stroke="#aa9a83" stroke-width="2"/><ellipse cx="29" cy="17" rx="15" ry="5" fill="#4c2515"/><path d="M44 20 Q55 18 49 29 L41 29" stroke="#eee4d3" stroke-width="4" fill="none"/></svg><div>${s.name}</div><button class="green" onclick="deliver(${s.id})">تحویل سفارش</button>`;
  }else{
   el.innerHTML='<div style="font-size:27px;opacity:.35">☕</div><div class="muted">جای خالی</div>';
  }
  $('slots').appendChild(el);
 });
}
function makeOrders(){
 orders=[];
 for(let i=0;i<groups+1;i++){
  const t=orderTypes[Math.floor(Math.random()*orderTypes.length)];
  orders.push({id:nextId++,name:t.name,icon:t.icon,shot:t.shot,max:35,left:35,status:'waiting'});
 }
 selected=orders[0]?.id||null;
 renderOrders();renderStats();
}
function startRun(){
 if(running)return;
 running=true;timeLeft=120;done=0;slots=[];busy=false;
 makeOrders();renderSlots();
 $('startBtn').disabled=true;
 setMsg('سفارش را انتخاب کن و آماده‌سازی را شروع کن.');
 mainTimer=setInterval(()=>{
  if(!running)return;
  timeLeft--;
  if(timeLeft<=0){timeLeft=0;endRun('زمان تمام شد! برای تلاش دوباره شروع مجدد را بزن.');return}
  renderStats();
 },1000);
 orderTimer=setInterval(()=>{
  if(!running)return;
  orders.forEach(o=>{if(o.status==='waiting'){o.left--;if(o.left<=0)o.status='expired'}});
  if(orders.some(o=>o.status==='expired')){endRun('زمان یکی از سفارش‌ها تمام شد! این دور تمام شد.');return}
  renderOrders();renderStats();
 },1000);
 renderStats();
}
function grind(){
 if(!running||busy||!selected)return setMsg('اول بازی را شروع و یک سفارش را انتخاب کن.');
 if(!grinderLevel)return setMsg('ابتدا آسیاب را خریداری کن.');
 if(slots.length>=3)return setMsg('میز کار پر است؛ یک سفارش را تحویل بده.');
 const o=orders.find(x=>x.id===selected&&x.status==='waiting');
 if(!o)return setMsg('یک سفارش فعال انتخاب کن.');
 busy=true;
 const seconds={1:3,2:2.2,3:1.5}[grinderLevel]||3;
 setMsg('در حال آسیاب قهوه…');
 setTimeout(()=>{
  if(!running)return;
  busy=false;
  extract(o);
 },seconds*1000);
}
function extract(o){
 if(!running)return;
 busy=true;setMsg('در حال عصاره‌گیری اسپرسو…');
 setTimeout(()=>{
  if(!running)return;
  busy=false;
  if(o.status!=='waiting'){setMsg('زمان این سفارش تمام شده.');return}
  slots.push({id:nextId++,orderId:o.id,name:o.name,shot:o.shot});
  setMsg('قهوه آماده شد! روی فنجان روی میز کار بزن تا تحویل شود.');
  renderSlots();
 },groups>=2?2500:4000);
}
function deliver(slotId){
 if(!running)return setMsg('ابتدا بازی را شروع کن.');
 const index=slots.findIndex(s=>s.id===slotId);
 if(index<0)return;
 const s=slots[index],o=orders.find(x=>x.id===s.orderId);
 if(!o||o.status!=='waiting')return setMsg('این سفارش دیگر فعال نیست.');
 o.status='served';slots.splice(index,1);done++;
 if(done>=100){endRun('تبریک! هر ۱۰۰ سفارش تکمیل شد.');return}
 const t=orderTypes[Math.floor(Math.random()*orderTypes.length)];
 orders=orders.filter(x=>x.id!==o.id);
 orders.push({id:nextId++,name:t.name,icon:t.icon,shot:t.shot,max:35,left:35,status:'waiting'});
 selected=orders.find(x=>x.status==='waiting')?.id||null;
 renderOrders();renderSlots();renderStats();
 setMsg('سفارش تحویل شد! برای سفارش بعدی آماده شو.');
}
function upgradeMachine(){
 if(running)return setMsg('برای ارتقای دستگاه ابتدا بازی را تمام کن.');
 if(groups>=4)return;
 const price=machinePrices[groups+1];
 if(coins<price)return;
 coins-=price;groups++;
 renderStats();makeOrders();
 setMsg('دستگاه ارتقا یافت؛ سفارش‌های بیشتری در دسترس‌اند.');
}
function resetRun(){
 running=false;clearInterval(mainTimer);clearInterval(orderTimer);
 timeLeft=120;done=0;orders=[];slots=[];selected=null;busy=false;
 $('startBtn').disabled=false;
 renderOrders();renderSlots();renderStats();
 setMsg('برای شروع دور جدید، دکمه شروع بازی را بزن.');
}
function init(){
 renderStats();renderOrders();renderSlots();
}
init();
</script>
</body>
</html>
